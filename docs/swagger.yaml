basePath: /
definitions:
  engine.Agent:
    properties:
      fallbackChain:
        example:
        - '["groq"'
        - ' "anthropic"]'
        items:
          type: string
        type: array
      firstMessage:
        example: Hello! Thank you for calling Acme. How can I help you?
        type: string
      id:
        example: agent-99
        type: string
      llmProviderId:
        example: openai
        type: string
      maxDurationSec:
        example: 600
        type: integer
      mode:
        allOf:
        - $ref: '#/definitions/engine.Mode'
        example: realtime
      name:
        example: Acme Receptionist
        type: string
      sttProviderId:
        example: deepgram
        type: string
      systemPrompt:
        example: You are a helpful office receptionist.
        type: string
      tenantId:
        example: tenant-123
        type: string
      tools:
        items:
          $ref: '#/definitions/engine.AgentTool'
        type: array
      ttsProviderId:
        example: elevenlabs
        type: string
      vadSensitivity:
        example: 0.5
        type: number
      voice:
        example: alloy
        type: string
    type: object
  engine.AgentTool:
    properties:
      description:
        example: Get details for a customer
        type: string
      name:
        example: get_customer_info
        type: string
      parameters:
        additionalProperties: true
        type: object
    type: object
  engine.Mode:
    enum:
    - realtime
    - pipeline
    type: string
    x-enum-comments:
      ModePipeline: Orchestrated (STT -> LLM -> TTS)
      ModeRealtime: Bidirectional WebSockets OpenAI/Groq
    x-enum-descriptions:
    - Bidirectional WebSockets OpenAI/Groq
    - Orchestrated (STT -> LLM -> TTS)
    x-enum-varnames:
    - ModeRealtime
    - ModePipeline
  telephony.ErrorResponse:
    properties:
      error:
        example: invalid request body
        type: string
    type: object
  telephony.OutboundCallRequest:
    properties:
      agentPrompt:
        example: You are a friendly assistant.
        type: string
      targetNumber:
        example: "+15550199"
        type: string
      tenantId:
        example: tenant-123
        type: string
    required:
    - agentPrompt
    - targetNumber
    - tenantId
    type: object
  telephony.OutboundCallResponse:
    properties:
      callSid:
        example: CAXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
        type: string
      status:
        example: queued
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Microservice engine handling low latency bidirectionnal Twilio-to-LLM
    audio routing and asynchronous tool calling.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Vocal Engine AI Agent Microservice API
  version: "1.0"
paths:
  /api/v1/agents:
    get:
      description: Retrieves all voice agent profiles currently registered in the
        system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/engine.Agent'
            type: array
      summary: List configured AI Agents
      tags:
      - Agents
    post:
      consumes:
      - application/json
      description: Configures an AI agent's voice, prompts, tools, STT/TTS engine,
        and failover fallbacks
      parameters:
      - description: Agent Profile Specifications
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/engine.Agent'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/engine.Agent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/telephony.ErrorResponse'
      summary: Create an AI Agent profile
      tags:
      - Agents
  /api/v1/call/inbound:
    post:
      description: Receives webhook requests from Twilio for incoming calls and connects
        them to a configured agent stream
      parameters:
      - description: Registered Agent ID
        in: query
        name: agentId
        required: true
        type: string
      - description: Registered Tenant ID
        in: query
        name: tenantId
        required: true
        type: string
      produces:
      - text/xml
      responses:
        "200":
          description: TwiML XML response
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/telephony.ErrorResponse'
      summary: Handle Inbound Telephony Webhooks
      tags:
      - Telephony
  /api/v1/call/outbound:
    post:
      consumes:
      - application/json
      description: Initiates an outbound call via Twilio and connects the voice channel
        to the WebSocket stream
      parameters:
      - description: Outbound Call Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/telephony.OutboundCallRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/telephony.OutboundCallResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/telephony.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/telephony.ErrorResponse'
      summary: Trigger an outbound voice call
      tags:
      - Telephony
swagger: "2.0"
